<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Das Notenwerte Quiz</title>

  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card-light: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --white: #ffffff;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

.highscore-title {
  font-size: 1.4rem;
  margin-top: 26px;
  margin-bottom: 14px;
  color: var(--text);
  letter-spacing: -0.03em;
}


    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(167, 139, 250, 0.18), transparent 35%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .app {
      width: min(980px, 100%);
      min-height: 680px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 30px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    header {
      padding: 28px 30px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.7rem);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      color: var(--text);
      min-width: 92px;
      text-align: center;
    }

    .timer-pill {
      position: relative;
      overflow: hidden;
    }

    .timer-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.24), rgba(167, 139, 250, 0.24));
      z-index: 0;
      transition: width 0.2s linear;
    }

    .timer-pill span {
      position: relative;
      z-index: 1;
    }

    main {
      padding: 28px 30px 34px;
    }

    .progress-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .question-card {
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.95), rgba(17, 24, 39, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 26px;
      padding: 30px;
      min-height: 485px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .question-top {
      display: grid;
      gap: 24px;
    }

    .question-number {
      color: var(--muted);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .question-text {
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      line-height: 1.18;
      letter-spacing: -0.035em;
      margin: 0;
      max-width: 820px;
      font-weight: 850;
    }

    .notation-area {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px 14px 10px;
      min-height: 150px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .notation-area.active {
      display: flex;
    }

    .notation-area svg {
      max-width: 100%;
      height: auto;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .answer {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      border-radius: 18px;
      padding: 18px 18px;
      text-align: left;
      font-size: 1.05rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      min-height: 64px;
    }

    .answer:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(56, 189, 248, 0.55);
    }

    .answer:disabled {
      cursor: not-allowed;
      opacity: 0.78;
      transform: none;
    }

    .answer.correct {
      border-color: rgba(34, 197, 94, 0.85);
      background: rgba(34, 197, 94, 0.16);
    }

    .answer.wrong {
      border-color: rgba(239, 68, 68, 0.85);
      background: rgba(239, 68, 68, 0.16);
    }

    .start-screen,
    .end-screen {
      min-height: 560px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }

    .start-box,
    .end-box {
      width: min(560px, 100%);
      background: rgba(31, 41, 55, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 38px;
      box-shadow: var(--shadow);
    }

    .big-title {
      font-size: clamp(2.2rem, 7vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
      margin: 0 0 28px;
    }

    .primary-btn {
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06111f;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 16px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 14px 38px rgba(56, 189, 248, 0.25);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.55);
      backdrop-filter: blur(10px);
      z-index: 20;
      padding: 24px;
    }

    .overlay.show {
      display: flex;
      animation: fadeIn 0.18s ease both;
    }

    .popup {
      width: min(440px, 100%);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: popIn 0.25s cubic-bezier(.2, 1.2, .2, 1) both;
    }

    .popup-icon {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      font-size: 2.2rem;
      font-weight: 950;
    }

    .popup-icon.good {
      background: rgba(34, 197, 94, 0.16);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .popup-icon.bad {
      background: rgba(239, 68, 68, 0.16);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .popup h2 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.05em;
    }

    .popup p {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .score-big {
      font-size: clamp(3.4rem, 10vw, 6.5rem);
      letter-spacing: -0.08em;
      margin: 8px 0 26px;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hidden {
      display: none !important;
    }

    @keyframes popIn {
      from {
        transform: scale(0.88) translateY(12px);
        opacity: 0;
      }
      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 720px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        width: 100%;
        justify-content: space-between;
      }

      .pill {
        flex: 1;
      }

      main {
        padding: 20px;
      }

      .question-card {
        padding: 22px;
      }

      .answers {
        grid-template-columns: 1fr;
      }
    }

.name-popup {
  display: grid;
  gap: 18px;
}

.name-input {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text);
  border-radius: 18px;
  padding: 16px 18px;
  font-size: 1.1rem;
  font-weight: 800;
  outline: none;
  text-align: center;
}

.name-input::placeholder {
  color: var(--muted);
}

.name-input:focus {
  border-color: rgba(56, 189, 248, 0.8);
  box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
}

.highscore-area {
  margin: 20px auto 28px;
  width: min(560px, 100%);
}

.highscore-title {
  font-size: 1.25rem;
  margin: 0 0 12px;
  color: var(--text);
  font-weight: 900;
  text-align: center;
}

.highscore-list {
  display: grid;
  gap: 10px;
  width: 100%;
}

.highscore-entry {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) 130px;
  gap: 12px;
  align-items: center;
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 1rem;
  line-height: 1.2;
}

.highscore-entry span {
  display: block;
  color: #ffffff;
  -webkit-text-fill-color: #ffffff;
  background: transparent;
}

.highscore-rank {
  font-weight: 950;
  color: var(--accent) !important;
  -webkit-text-fill-color: var(--accent) !important;
  text-align: left;
}

.highscore-name {
  font-weight: 850;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.highscore-score {
  font-weight: 950;
  text-align: right;
  white-space: nowrap;
}

.no-highscores {
  color: var(--muted);
  font-weight: 700;
  margin: 0;
  text-align: center;
}


#nameOverlay {
  background:
    radial-gradient(circle at top left, rgba(56, 189, 248, 0.24), transparent 34%),

  backdrop-filter: blur(16px);
}

.name-popup {
  width: min(420px, 92vw);
  display: grid;
  gap: 18px;

}

.name-popup h2 {
  margin: 0;

}

}

.name-input::placeholder {

}

.name-input:focus {
  border-color: rgba(56, 189, 248, 0.8);
  box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
}

  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>Das Notenwerte Quiz</h1>

      <div class="status">
        <div class="pill" id="questionCounter">1 / 15</div>
        <div class="pill">Punkte: <span id="scoreDisplay">0</span></div>
        <div class="pill timer-pill">
          <div class="timer-fill" id="timerFill"></div>
          <span>Zeit: <span id="timerDisplay">20.0</span></span>
        </div>
      </div>
    </header>

    <main>
      <section class="start-screen" id="startScreen">
        <div class="start-box">
          <h2 class="big-title">Das Notenwerte Quiz</h2>
          <button class="primary-btn" id="startBtn">Start</button>
        </div>
      </section>

      <section class="quiz-screen hidden" id="quizScreen">
        <div class="progress-wrap">
          <div class="progress" id="progress"></div>
        </div>

        <div class="question-card">
          <div class="question-top">
            <div class="question-number" id="questionLabel">Frage</div>
            <p class="question-text" id="questionText"></p>
            <div class="notation-area" id="notationArea"></div>
          </div>

          <div class="answers" id="answers"></div>
        </div>
      </section>

      <section class="end-screen hidden" id="endScreen">
        <div class="end-box">
          <h2 class="big-title">Fertig!</h2>
          <div class="score-big" id="finalScore">0</div>

<div class="highscore-area">
  <div class="highscore-title">Highscores</div>
  <div id="highscoreContainer"></div>
</div>

<button class="primary-btn" id="restartBtn">Nochmal spielen</button>
        </div>
      </section>
    </main>
  </div>

<div class="overlay" id="nameOverlay">
  <div class="popup name-popup">
    <h2>Dein Name</h2>

    <input
      type="text"
      id="nameInput"
      class="name-input"
      maxlength="18"
      placeholder="Name eingeben"
      autocomplete="off"
    />

    <button class="primary-btn" id="confirmNameBtn">Quiz starten</button>
  </div>
</div>

  <div class="overlay" id="feedbackOverlay">

      <h2 id="feedbackTitle">Richtig!</h2>
      <p id="feedbackText">+100 Punkte</p>
    </div>
  </div>

function shuffleArray(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const randomIndex = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[randomIndex]] = [copy[randomIndex], copy[i]];
  }

  return copy;
}

    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const endScreen = document.getElementById("endScreen");

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const questionCounter = document.getElementById("questionCounter");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const timerDisplay = document.getElementById("timerDisplay");
    const timerFill = document.getElementById("timerFill");
    const progress = document.getElementById("progress");

    const questionLabel = document.getElementById("questionLabel");
    const questionText = document.getElementById("questionText");
    const notationArea = document.getElementById("notationArea");
    const answersEl = document.getElementById("answers");

    const feedbackOverlay = document.getElementById("feedbackOverlay");
    const feedbackIcon = document.getElementById("feedbackIcon");
    const feedbackTitle = document.getElementById("feedbackTitle");
    const feedbackText = document.getElementById("feedbackText");

    const finalScore = document.getElementById("finalScore");

const highscoreContainer = document.getElementById("highscoreContainer");

const nameOverlay = document.getElementById("nameOverlay");
const nameInput = document.getElementById("nameInput");
const confirmNameBtn = document.getElementById("confirmNameBtn");

    let currentQuestion = 0;
    let score = 0;
    let timeLeft = MAX_TIME;
    let timer = null;
    let locked = false;
    let playerName = "";

let pendingLevel = 1;
let currentLevel = 1;

    startBtn.addEventListener("click", startQuiz);
    restartBtn.addEventListener("click", startQuiz);

    function startQuiz() {
  playerName = prompt("Wie heißt du?");

  if (!playerName || playerName.trim() === "") {
    playerName = "Unbekannt";
  }

  playerName = playerName.trim().substring(0, 18);

  questions = shuffleArray(questionPool).slice(0, 15);

  currentQuestion = 0;
  score = 0;
  scoreDisplay.textContent = score;

  startScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");

  showQuestion();
}

    function showQuestion() {
      locked = false;
      clearInterval(timer);

      const q = questions[currentQuestion];

      questionCounter.textContent = `${currentQuestion + 1} / ${questions.length}`;
      questionLabel.textContent = `Frage ${currentQuestion + 1}`;
      questionText.textContent = q.question;
      progress.style.width = `${(currentQuestion / questions.length) * 100}%`;

      answersEl.innerHTML = "";
      notationArea.innerHTML = "";
      notationArea.classList.remove("active");

      if (q.notation) {
        notationArea.classList.add("active");
        setTimeout(() => drawNotation(q.notation), 30);
      }

      q.answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.textContent = answer;
        btn.addEventListener("click", () => chooseAnswer(index));
        answersEl.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      timeLeft = MAX_TIME;
      updateTimerDisplay();

      timer = setInterval(() => {
        timeLeft -= 0.1;

        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimerDisplay();
          clearInterval(timer);
          chooseAnswer(null);
          return;
        }

        updateTimerDisplay();
      }, 100);
    }

    function updateTimerDisplay() {
      timerDisplay.textContent = timeLeft.toFixed(1);
      timerFill.style.width = `${(timeLeft / MAX_TIME) * 100}%`;

      if (timeLeft <= 3) {
        timerFill.style.background = "rgba(239, 68, 68, 0.28)";
      } else {
        timerFill.style.background = "linear-gradient(90deg, rgba(56, 189, 248, 0.24), rgba(167, 139, 250, 0.24))";
      }
    }

    function chooseAnswer(selectedIndex) {
      if (locked) return;
      locked = true;
      clearInterval(timer);

      const q = questions[currentQuestion];
      const buttons = [...document.querySelectorAll(".answer")];

      buttons.forEach((btn, index) => {
        btn.disabled = true;

        if (index === q.correct) {
          btn.classList.add("correct");
        }

        if (selectedIndex === index && selectedIndex !== q.correct) {
          btn.classList.add("wrong");
        }
      });

      const isCorrect = selectedIndex === q.correct;
      let gained = 0;

      if (isCorrect) {
        gained = BASE_POINTS + Math.round(timeLeft * SPEED_MULTIPLIER);
        score += gained;
        scoreDisplay.textContent = score;
      }

      showFeedback(isCorrect, gained);

      setTimeout(() => {
        hideFeedback();
        currentQuestion++;

        if (currentQuestion >= questions.length) {
          finishQuiz();
        } else {
          showQuestion();
        }
      }, 1150);
    }

    function showFeedback(isCorrect, gained) {
      feedbackOverlay.classList.add("show");

      if (isCorrect) {
        feedbackIcon.textContent = "✓";
        feedbackIcon.className = "popup-icon good";
        feedbackTitle.textContent = "Richtig!";
        feedbackText.textContent = `+${gained} Punkte`;
      } else {
        feedbackIcon.textContent = "×";
        feedbackIcon.className = "popup-icon bad";
        const correctAnswer = questions[currentQuestion].answers[questions[currentQuestion].correct];

feedbackTitle.textContent = "Leider falsch!";
feedbackText.innerHTML = `
  Richtig wäre:<br>
  <strong>${correctAnswer}</strong>
`;
      }
    }

    function hideFeedback() {
      feedbackOverlay.classList.remove("show");
    }

    function finishQuiz() {
  clearInterval(timer);

  saveHighscore(playerName, score);

  quizScreen.classList.add("hidden");
  endScreen.classList.remove("hidden");
  progress.style.width = "100%";

finalScore.textContent = score;
  highscoreContainer.innerHTML = createHighscoreHTML();
  
}

function getHighscores() {
  const savedScores = localStorage.getItem("notenwerteQuizHighscores");

  if (!savedScores) {
    return [];
  }

  return JSON.parse(savedScores);
}

function saveHighscore(name, points) {
  const highscores = getHighscores();

  highscores.push({
    name: name,
    score: points,
    date: new Date().toLocaleDateString("de-DE")
  });

  highscores.sort((a, b) => b.score - a.score);

  const topFive = highscores.slice(0, 5);

  localStorage.setItem("notenwerteQuizHighscores", JSON.stringify(topFive));
}

function createHighscoreHTML() {
  const highscores = getHighscores();

  if (highscores.length === 0) {
    return "<p>Noch keine Highscores vorhanden.</p>";
  }

  return `
    <div class="highscore-list">
      ${highscores.map((entry, index) => `
        <div class="highscore-entry">
          <span class="highscore-rank">${index + 1}.</span>
          <span class="highscore-name">${entry.name}</span>
          <span class="highscore-score">${entry.score} Punkte</span>
        </div>
      `).join("")}
    </div>
  `;
}

    function drawNotation(config) {
      notationArea.innerHTML = "";

      const width = Math.min(760, notationArea.clientWidth - 16);
      const height = 150;

      const renderer = new VF.Renderer(notationArea, VF.Renderer.Backends.SVG);
      renderer.resize(width, height);

      const context = renderer.getContext();
      context.setFont("Arial", 10);

      const staveWidth = Math.max(260, width - 30);
      const stave = new VF.Stave(14, 28, staveWidth);

      stave.addClef("treble");

      if (config.time) {
        stave.addTimeSignature(config.time);
      }

      stave.setContext(context).draw();

      const notes = config.notes.map((duration, index) => {
        const pitches = ["c/4", "d/4", "e/4", "f/4", "g/4"];
        return new VF.StaveNote({
          keys: [pitches[index % pitches.length]],
          duration
        });
      });

      notes.forEach(note => {
        if (note.getDuration() === "8" || note.getDuration() === "16") {
          VF.Beam.generateBeams([note]).forEach(beam => beam.setContext(context).draw());
        }
      });

      const voice = new VF.Voice({
        num_beats: 4,
        beat_value: 4
      });

      voice.setStrict(false);
      voice.addTickables(notes);

      new VF.Formatter()
        .joinVoices([voice])
        .format([voice], staveWidth - 95);

      voice.draw(context, stave);

      if (config.time === "4/4") {
        drawMissingBox(context, stave, notes.length);
      }
    }

    function drawMissingBox(context, stave, noteCount) {
      const startX = stave.getX() + stave.getWidth() - 90;
      const y = stave.getY() + 42;

      context.save();
      context.setStrokeStyle("#38bdf8");
      context.setFillStyle("rgba(56, 189, 248, 0.10)");
      context.setLineWidth(2);

      context.beginPath();
      context.rect(startX, y, 54, 38);
      context.fill();
      context.stroke();

      context.setFillStyle("#0f172a");
      context.setFont("Arial", 22, "bold");
      context.fillText("?", startX + 21, y + 27);
      context.restore();
    }

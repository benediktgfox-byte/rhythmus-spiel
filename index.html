<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Runner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #14152b;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin: 12px 0 4px;
  color: #ffd166;
}

#game {
  width: min(100%, 900px);
  margin: auto;
}

#info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  font-weight: bold;
}

#scene {
  position: relative;
  height: 440px;
  overflow: hidden;
  border: 4px solid #5145a4;
  border-radius: 18px;
  background:
    linear-gradient(#292a63 0 65%, #20213e 65% 100%);
}

.star {
  position: absolute;
  color: #fff3a3;
  font-size: 20px;
}

.s1 { left: 10%; top: 12%; }
.s2 { left: 32%; top: 22%; }
.s3 { right: 20%; top: 10%; }
.s4 { right: 8%; top: 30%; }

#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 125px;
  background: repeating-linear-gradient(
    45deg,
    #36a269,
    #36a269 18px,
    #278052 18px,
    #278052 36px
  );
  border-top: 8px solid #8b5a3c;
}

#player {
  position: absolute;
  left: 50px;
  bottom: 125px;
  font-size: 46px;
  z-index: 5;
  transition: left .6s ease, bottom .2s ease;
}

#player.jump {
  animation: jump .7s ease;
}

@keyframes jump {
  0% { bottom: 125px; }
  50% { bottom: 230px; }
  100% { bottom: 125px; }
}

.platform {
  position: absolute;
  bottom: 210px;
  width: 120px;
  height: 18px;
  border-radius: 10px;
  background: #d99242;
}

.p1 { left: 210px; }
.p2 { left: 430px; bottom: 270px; }
.p3 { right: 80px; }

.obstacle {
  position: absolute;
  bottom: 125px;
  font-size: 42px;
}

.o1 { left: 300px; }
.o2 { left: 570px; }
.o3 { right: 170px; }

#task {
  display: none;
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(90%, 500px);
  padding: 20px;
  border: 4px solid #ffd166;
  border-radius: 20px;
  background: #24264e;
  box-shadow: 0 0 30px #000;
}

#symbol {
  margin: 12px;
  font-size: 80px;
  color: #ffd166;
}

#answers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

button {
  padding: 13px;
  border: 0;
  border-radius: 12px;
  background: #7067d8;
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
}

button:hover {
  background: #8e86ed;
}

#start,
#continue {
  margin: 12px;
  background: #ef8354;
}

#message {
  min-height: 28px;
  padding: 8px;
  color: #ffd166;
  font-weight: bold;
}

.correct {
  color: #75e06f;
}

.wrong {
  color: #ff6b6b;
}

@media (max-width: 600px) {
  #scene {
    height: 390px;
  }

  #player {
    left: 25px;
  }

  .platform {
    transform: scale(.75);
  }

  .obstacle {
    transform: scale(.8);
  }
}
</style>
</head>

<body>

<div id="game">
  <h1>🎵 Rhythm Runner</h1>
  <p>Springe über Hindernisse und löse die Rhythmus-Aufgaben!</p>

  <div id="info">
    <span>❤️ Leben: <b id="lives">3</b></span>
    <span>⭐ Punkte: <b id="score">0</b></span>
    <span>🏁 Level: <b id="level">1</b></span>
  </div>

  <div id="scene">
    <span class="star s1">✦</span>
    <span class="star s2">✦</span>
    <span class="star s3">✦</span>
    <span class="star s4">✦</span>

    <div class="platform p1"></div>
    <div class="platform p2"></div>
    <div class="platform p3"></div>

    <div class="obstacle o1">🪨</div>
    <div class="obstacle o2">🌵</div>
    <div class="obstacle o3">🔥</div>

    <div id="ground"></div>
    <div id="player">🧑‍🎤</div>

    <div id="task">
      <h2>🎼 Rhythmus-Aufgabe</h2>
      <p>Wie viele Zählzeiten hat dieses Zeichen?</p>
      <div id="symbol">♩</div>
      <div id="answers"></div>
      <p id="taskMessage"></p>
    </div>
  </div>

  <div id="message">Bereit für das Abenteuer?</div>
  <button id="start">▶️ Spiel starten</button>
  <button id="continue" style="display:none">➡️ Weiterlaufen</button>
</div>

<script>
const tasks = [
  { symbol: "♩", answer: "1", options: ["0,5", "1", "2"] },
  { symbol: "𝅗𝅥", answer: "2", options: ["1", "2", "4"] },
  { symbol: "𝅝", answer: "4", options: ["2", "3", "4"] },
  { symbol: "♪", answer: "0,5", options: ["0,5", "1", "2"] }
];

let currentTask = 0;
let score = 0;
let lives = 3;
let level = 1;
let playing = false;
let taskOpen = false;

const player = document.getElementById("player");
const taskBox = document.getElementById("task");
const symbolBox = document.getElementById("symbol");
const answersBox = document.getElementById("answers");
const taskMessage = document.getElementById("taskMessage");
const message = document.getElementById("message");

function updateInfo() {
  document.getElementById("lives").textContent = lives;
  document.getElementById("score").textContent = score;
  document.getElementById("level").textContent = level;
}

function movePlayer() {
  if (!playing || taskOpen) return;

  const newPosition = Math.min(
    player.offsetLeft + 105,
    document.getElementById("scene").clientWidth - 80
  );

  player.style.left = newPosition + "px";
  player.classList.add("jump");

  setTimeout(() => {
    player.classList.remove("jump");
  }, 700);

  if (currentTask < tasks.length) {
    setTimeout(openTask, 750);
  } else {
    winGame();
  }
}

function openTask() {
  if (!playing) return;

  taskOpen = true;
  const task = tasks[currentTask];

  symbolBox.textContent = task.symbol;
  answersBox.innerHTML = "";
  taskMessage.textContent = "";

  task.options.forEach(option => {
    const button = document.createElement("button");
    button.textContent = option;
    button.onclick = () => checkAnswer(option);
    answersBox.appendChild(button);
  });

  taskBox.style.display = "block";
}

function checkAnswer(answer) {
  const task = tasks[currentTask];

  if (answer === task.answer) {
    score += 100;
    taskMessage.textContent = "✅ Richtig! Du darfst weiterlaufen.";
    taskMessage.className = "correct";

    setTimeout(() => {
      taskBox.style.display = "none";
      taskOpen = false;
      currentTask++;
      level = Math.min(3, Math.floor(currentTask / 2) + 1);
      updateInfo();

      if (currentTask >= tasks.length) {
        winGame();
      } else {
        message.textContent = "Gut gemacht! Springe zum nächsten Hindernis.";
      }
    }, 800);
  } else {
    lives--;
    updateInfo();

    taskMessage.textContent = "❌ Leider falsch. Versuch es noch einmal.";
    taskMessage.className = "wrong";

    if (lives <= 0) {
      gameOver();
    }
  }
}

function winGame() {
  playing = false;
  taskOpen = false;
  taskBox.style.display = "none";
  message.textContent = "🏆 Glückwunsch! Du hast das Rhythmus-Level geschafft!";
  document.getElementById("continue").style.display = "none";
}

function gameOver() {
  playing = false;
  taskOpen = false;
  taskBox.style.display = "none";
  message.textContent = "💥 Game Over! Starte das Spiel erneut.";
  document.getElementById("start").style.display = "inline-block";
  document.getElementById("continue").style.display = "none";
}

document.getElementById("start").onclick = () => {
  currentTask = 0;
  score = 0;
  lives = 3;
  level = 1;
  playing = true;
  taskOpen = false;

  player.style.left = "50px";
  updateInfo();

  document.getElementById("start").style.display = "none";
  document.getElementById("continue").style.display = "inline-block";
  message.textContent = "Laufe los und löse die Aufgaben!";
};

document.getElementById("continue").onclick = movePlayer;

document.addEventListener("keydown", event => {
  if (event.code === "Space" || event.code === "ArrowRight") {
    event.preventDefault();
    movePlayer();
  }
});
</script>

</body>
</html>

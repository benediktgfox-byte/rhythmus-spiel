<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Kart – Rhythmusrennen</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: #111936;
}

h1 {
  margin: 8px 0 2px;
  color: #ffe066;
  text-shadow: 3px 3px #bd3b70;
}

#hud {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 7px;
  font-weight: bold;
}

#game {
  position: relative;
  width: min(100%, 950px);
  height: calc(100vh - 90px);
  min-height: 480px;
  margin: auto;
  overflow: hidden;
  border: 5px solid #e85d75;
  border-radius: 22px;
  background: linear-gradient(#62c6ed 0 38%, #6dc56b 38% 100%);
}

/* Himmel */
.cloud {
  position: absolute;
  z-index: 1;
  font-size: 42px;
  opacity: .85;
}

.c1 { left: 8%; top: 8%; }
.c2 { right: 12%; top: 16%; }

/* Rennstrecke */
#road {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 63%;
  background: #454557;
  transform: perspective(400px) rotateX(8deg);
}

#road::before,
#road::after {
  content: "";
  position: absolute;
  top: 0;
  width: 20px;
  height: 100%;
  background: repeating-linear-gradient(
    to bottom,
    #fff 0 35px,
    #e85d75 35px 70px
  );
}

#road::before { left: 0; }
#road::after { right: 0; }

.lane-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 8px;
  opacity: .8;
  background: repeating-linear-gradient(
    to bottom,
    #fff 0 45px,
    transparent 45px 95px
  );
}

.line1 { left: 33%; }
.line2 { left: 66%; }

/* Dekorationen */
.tree {
  position: absolute;
  bottom: 43%;
  z-index: 2;
  font-size: 52px;
}

.t1 { left: 4%; }
.t2 { right: 4%; }
.t3 { left: 22%; transform: scale(.8); }
.t4 { right: 24%; transform: scale(.8); }

/* Kart */
#kart {
  position: absolute;
  z-index: 8;
  left: 50%;
  bottom: 18%;
  transform: translateX(-50%);
  font-size: 58px;
  transition: bottom .25s;
}

#kart.jumping {
  animation: jump .75s ease;
}

@keyframes jump {
  0%   { bottom: 18%; }
  45%  { bottom: 52%; }
  100% { bottom: 18%; }
}

/* Hindernisse bewegen sich nach links */
.obstacle {
  position: absolute;
  z-index: 7;
  right: -100px;
  bottom: 20%;
  font-size: 48px;
  animation: drive 3.3s linear forwards;
}

@keyframes drive {
  from { right: -100px; }
  to   { right: 110%; }
}

/* Quizfenster */
#quiz {
  display: none;
  position: absolute;
  z-index: 20;
  left: 50%;
  top: 50%;
  width: min(92%, 560px);
  padding: 20px;
  transform: translate(-50%, -50%);
  border: 5px solid #ffe066;
  border-radius: 22px;
  background: #252653;
  box-shadow: 0 0 35px #111;
}

#quiz h2 {
  margin-top: 0;
  color: #ffe066;
}

#note {
  margin: 12px;
  font-size: 78px;
  color: #ffe066;
}

#question {
  font-size: 1.15rem;
}

#answers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 15px;
}

button {
  padding: 13px;
  border: 0;
  border-radius: 13px;
  color: white;
  background: #7167d8;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px #484197;
}

button:hover {
  background: #8e85ed;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 1px #484197;
}

#jumpButton,
#startButton {
  position: absolute;
  z-index: 15;
  bottom: 18px;
  padding: 16px 26px;
  border-radius: 18px;
  background: #ef8354;
  font-size: 1.15rem;
  box-shadow: 0 5px #ae4f2c;
}

#jumpButton {
  right: 20px;
}

#startButton {
  left: 50%;
  transform: translateX(-50%);
}

#message {
  position: absolute;
  z-index: 16;
  top: 10px;
  left: 50%;
  width: 90%;
  transform: translateX(-50%);
  color: #fff;
  font-weight: bold;
  text-shadow: 2px 2px #222;
}

.good { color: #79e879; }
.bad { color: #ff8585; }

@media (max-width: 600px) {
  h1 { font-size: 1.45rem; }

  #game {
    min-height: 450px;
    border-width: 3px;
  }

  #kart {
    font-size: 48px;
  }

  #jumpButton {
    right: 12px;
    bottom: 12px;
  }

  #answers {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>🏎️ Beat Kart</h1>

<div id="hud">
  <span>❤️ Leben: <b id="lives">3</b></span>
  <span>⭐ Punkte: <b id="score">0</b></span>
  <span>🏁 Frage: <b id="number">0</b>/15</span>
</div>

<div id="game">
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>

  <div class="tree t1">🌲</div>
  <div class="tree t2">🌴</div>
  <div class="tree t3">🌲</div>
  <div class="tree t4">🌴</div>

  <div id="road">
    <div class="lane-line line1"></div>
    <div class="lane-line line2"></div>
  </div>

  <div id="kart">🏎️</div>

  <div id="message">Starte das Rhythmusrennen!</div>

  <button id="startButton">▶️ Rennen starten</button>
  <button id="jumpButton" style="display:none">⬆️ SPRINGEN</button>

  <section id="quiz">
    <h2>🎼 Rhythmus-Check!</h2>
    <p id="question"></p>
    <div id="note"></div>
    <div id="answers"></div>
    <p id="quizMessage"></p>
  </section>
</div>

<script>
/*
  Die Notenwerte:
  Ganze Note = 4 Zählzeiten
  Halbe Note = 2 Zählzeiten
  Viertelnote = 1 Zählzeit
  Achtelnote = 0,5 Zählzeiten
*/

const notes = [
  { symbol: "𝅝", name: "Ganze Note", value: 4, text: "4" },
  { symbol: "𝅗𝅥", name: "Halbe Note", value: 2, text: "2" },
  { symbol: "♩", name: "Viertelnote", value: 1, text: "1" },
  { symbol: "♪", name: "Achtelnote", value: 0.5, text: "0,5" }
];

let allQuestions = [];
let selectedQuestions = [];
let questionIndex = 0;
let score = 0;
let lives = 3;
let running = false;
let quizOpen = false;
let obstacleTimer;

/* Erzeugt weit mehr als 80 verschiedene Fragen */
function createQuestions() {
  const questions = [];

  notes.forEach(note => {
    questions.push({
      note,
      text: `Wie viele Zählzeiten hat eine ${note.name}?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Welcher Notenwert ist hier zu sehen?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie lange wird dieses Zeichen gehalten?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie viele Zählzeiten dauert dieses Symbol?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Welche Zahl passt zu dieser ${note.name}?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Bestimme die Länge dieser Note.`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie viele Schläge zählt dieses Notenzeichen?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Welche Zählzeit gehört zu diesem Symbol?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Erkennst du den Notenwert?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie viele Zählzeiten musst du klatschen?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie lang klingt diese Note im 4/4-Takt?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wähle die richtige Dauer aus.`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Welche Antwort ist musikalisch richtig?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie viele Grundschläge nimmt diese Note ein?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Finde die passende Zählzeit.`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie lange bleibt der Ton bestehen?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Welche Zahl beschreibt diesen Notenwert?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Wie viele Zählzeiten verstecken sich hier?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Richtig zuhören und auswählen: Wie lang ist die Note?`,
      answer: note.text
    });

    questions.push({
      note,
      text: `Letzte Chance: Wie viele Zählzeiten sind es?`,
      answer: note.text
    });
  });

  return questions;
}

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function updateHud() {
  document.getElementById("lives").textContent = lives;
  document.getElementById("score").textContent = score;
  document.getElementById("number").textContent =
    Math.min(questionIndex, 15);
}

function startGame() {
  allQuestions = createQuestions();
  selectedQuestions = shuffle(allQuestions).slice(0, 15);

  questionIndex = 0;
  score = 0;
  lives = 3;
  running = true;
  quizOpen = false;

  updateHud();

  document.getElementById("startButton").style.display = "none";
  document.getElementById("jumpButton").style.display = "block";
  document.getElementById("message").textContent =
    "Das Kart fährt automatisch – springe über Hindernisse!";

  clearInterval(obstacleTimer);
  obstacleTimer = setInterval(createObstacle, 2600);
}

function jump() {
  if (!running || quizOpen) return;

  const kart = document.getElementById("kart");
  kart.classList.remove("jumping");
  void kart.offsetWidth;
  kart.classList.add("jumping");

  setTimeout(() => {
    if (running && questionIndex < 15) {
      showQuestion();
    }
  }, 800);
}

function createObstacle() {
  if (!running || quizOpen) return;

  const obstacle = document.createElement("div");
  obstacle.className = "obstacle";

  const choices = ["🪨", "🌵", "🛢️", "🚧", "🔥"];
  obstacle.textContent =
    choices[Math.floor(Math.random() * choices.length)];

  obstacle.style.bottom = `${18 + Math.random() * 9}%`;
  document.getElementById("game").appendChild(obstacle);

  setTimeout(() => obstacle.remove(), 3500);

  setTimeout(() => {
    if (running && !quizOpen && questionIndex < 15) {
      showQuestion();
    }
  }, 1800);
}

function showQuestion() {
  if (quizOpen || questionIndex >= 15) return;

  quizOpen = true;
  const current = selectedQuestions[questionIndex];

  document.getElementById("quiz").style.display = "block";
  document.getElementById("question").textContent = current.text;
  document.getElementById("note").textContent = current.note.symbol;
  document.getElementById("quizMessage").textContent = "";

  const wrongAnswers = notes
    .map(note => note.text)
    .filter(value => value !== current.answer);

  const answers = shuffle([
    current.answer,
    ...shuffle(wrongAnswers).slice(0, 3)
  ]);

  const answersBox = document.getElementById("answers");
  answersBox.innerHTML = "";

  answers.forEach(answer => {
    const button = document.createElement("button");
    button.textContent = `${answer} Zählzeit${answer === "1" ? "" : "en"}`;
    button.onclick = () => checkAnswer(answer);
    answersBox.appendChild(button);
  });
}

function checkAnswer(answer) {
  const current = selectedQuestions[questionIndex];
  const quizMessage = document.getElementById("quizMessage");

  if (answer === current.answer) {
    score += 100;
    quizMessage.textContent = "✅ Richtig! Das Kart fährt weiter.";
    quizMessage.className = "good";

    setTimeout(closeQuestion, 700);
  } else {
    lives--;
    updateHud();

    quizMessage.textContent = "❌ Falsch! Du verlierst ein Leben.";
    quizMessage.className = "bad";

    if (lives <= 0) {
      setTimeout(gameOver, 700);
    }
  }
}

function closeQuestion() {
  document.getElementById("quiz").style.display = "none";
  quizOpen = false;
  questionIndex++;
  updateHud();

  if (questionIndex >= 15) {
    winGame();
  } else {
    document.getElementById("message").textContent =
      "Hindernis voraus – bereit zum Springen?";
  }
}

function gameOver() {
  running = false;
  quizOpen = false;
  clearInterval(obstacleTimer);

  document.getElementById("quiz").style.display = "none";
  document.getElementById("jumpButton").style.display = "none";
  document.getElementById("startButton").style.display = "block";
  document.getElementById("startButton").textContent = "🔄 Nochmal fahren";
  document.getElementById("message").textContent =
    "💥 Rennen vorbei! Versuche es noch einmal.";
}

function winGame() {
  running = false;
  clearInterval(obstacleTimer);

  document.getElementById("jumpButton").style.display = "none";
  document.getElementById("startButton").style.display = "block";
  document.getElementById("startButton").textContent = "🏆 Neues Rennen";
  document.getElementById("message").textContent =
    "🏁 Ziel erreicht! Du hast alle 15 Rhythmusfragen geschafft!";
}

document.getElementById("startButton").onclick = startGame;
document.getElementById("jumpButton").onclick = jump;

document.addEventListener("keydown", event => {
  if (event.code === "Space" || event.code === "ArrowUp") {
    event.preventDefault();
    jump();
  }
});
</script>

</body>
</html>
